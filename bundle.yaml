openapi: 3.0.0
info:
  title: Event Posters API
  version: 1.0.0
  description: API for managing event posters
paths:
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /auth/register:
    post:
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
  /events:
    get:
      summary: Get all event posters
      tags:
        - Events
      responses:
        '200':
          description: List of event posters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Create a new event poster
      tags:
        - Events
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /events/{eventId}:
    get:
      summary: Get single event poster by ID
      tags:
        - Events
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
          description: ID of the event to retrieve
          example: evt_abc123
      responses:
        '200':
          description: Event poster details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      summary: Delete an event poster
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Event deleted successfully
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    User:
      type: object
      required:
        - id
        - email
        - username
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
    AuthResponse:
      type: object
      required:
        - accessToken
        - user
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    Error:
      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - username
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        username:
          type: string
    EventBase:
      type: object
      properties:
        title:
          type: string
          example: Jazz Festival
        description:
          type: string
          example: Annual international jazz event
        date:
          type: string
          format: date-time
          example: '2023-07-15T19:00:00Z'
        location:
          type: string
          example: Central Park, New York
        imageUrl:
          type: string
          format: uri
          example: https://example.com/posters/jazz-festival.jpg
        price:
          type: number
          minimum: 0
          example: 25.99
        category:
          type: string
          enum:
            - concert
            - exhibition
            - festival
            - theater
            - sport
            - other
          example: festival
    Event:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - id
            - title
            - date
            - organizerId
          properties:
            id:
              type: string
              example: evt_abc123
            organizerId:
              type: string
              example: user_xyz456
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    EventCreate:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required:
            - title
            - date
          properties: {}
  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
