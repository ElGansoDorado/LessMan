schemas:
  User:
    type: object
    required:
      - id
      - email
      - username
    properties:
      id:
        type: string
      email:
        type: string
        format: email
      username:
        type: string

  LoginRequest:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password

  RegisterRequest:
    type: object
    required:
      - email
      - password
      - username
    properties:
      email:
        type: string
        format: email
      password:
        type: string
        format: password
      username:
        type: string

  AuthResponse:
    type: object
    required:
      - accessToken
      - user
    properties:
      accessToken:
        type: string
      user:
        $ref: "#/schemas/User"

login:
  summary: Login user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/schemas/LoginRequest"
  responses:
    "200":
      description: Login successful
      content:
        application/json:
          schema:
            $ref: "#/schemas/AuthResponse"
    "401":
      $ref: "../shared/responses.yaml#/UnauthorizedError"

register:
  summary: Register new user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "#/schemas/RegisterRequest"
  responses:
    "201":
      description: Registration successful
      content:
        application/json:
          schema:
            $ref: "#/schemas/AuthResponse"
    "400":
      $ref: "../shared/responses.yaml#/BadRequestError"
